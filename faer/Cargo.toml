[package]
name = "t4a-faer"
version = "0.27.1"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description.workspace = true
documentation.workspace = true
readme = "../README.md"
repository = "https://github.com/tensor4all/faer"
license = "MIT AND BSD-3-Clause"
keywords.workspace = true
categories.workspace = true
rust-version = "1.89.0"

# The dependency key stays `faer`, so downstream `use faer::...` is unchanged.
[lib]
name = "faer"

[dependencies]
bytemuck = "1.24.0"
generativity = "1.1.0"
reborrow = "0.5.5"
libm = { version = "0.2.15", default-features = false }

# the substrate of the parallel route: the team iterates through Rayon's plumbing
rayon = { version = "1.11.0", optional = true }
# the parallel route: `Par::Team` runs its regions on a threadteam team, see src/utils/team.rs.
# Optional, so that a no_std build (`--no-default-features`, `faer-no-std-test`) has no parallel
# route at all: `Par::Seq` is the only token it carries, and nothing pulls std in through Rayon.
threadteam = { version = "0.3.0", default-features = false, optional = true }
log = { version = "0.4.29", optional = true }
rand = { version = "0.9.2", optional = true }
rand_distr = { version = "0.5.1", optional = true }
npyz = { version = "0.8.4", default-features = false, optional = true }

num-complex = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
dyn-stack = { version = "0.13.2", default-features = false, features = ["core-error", "alloc"] }
pulp = { version = "0.22.2", default-features = false, features = ["x86-v3"] }
equator = { version = "0.6.0" }

faer-traits = { package = "t4a-faer-traits", path = "../faer-traits", version = "0.24.2", default-features = false }

gemm = { version = "0.19.0", default-features = false }
nano-gemm = { version = "0.2.2", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# tensor4all fork of private-gemm-x86: 0.1.23 clamps the masked-store offset, without which
# DstKind::Upper/Lower writes below the diagonal on the 256-bit path (the library keeps the
# name `private_gemm_x86`, so no `use` changes). 0.1.25 and later add `gemm_with(.., &dyn Fork)`,
# so a `Par::Team` runs the kernel on its own members. 0.1.27 reverses the diagonal with a
# negative depth stride (faer#113), which `spicy_matmul` relies on.
t4a-private-gemm-x86 = { version = "0.1.27", default-features = false, optional = true }

[features]
default = [
  "std",
  "rayon",
  "threadteam",
  "sparse-linalg",
  "rand",
  "npy",
]
std = [
  "faer-traits/std",
  "pulp/std",
  "gemm/std",
  "nano-gemm/std",
  "libm/arch",
  "dep:t4a-private-gemm-x86",
]
# AVX-512 kernels at run time. The target features are stable from Rust 1.89, so this does not need
# the nightly compiler any more - but it is not a default feature yet: with `pulp/x86-v4` the
# library returns non-finite factors on this host (full-pivot LU `test_gh238`, QZ, matrix-free SVD,
# single-threaded), which is tensor4all/faer#86's open question. A build without it selects AVX2.
x86-v4 = [
  "pulp/x86-v4",
  "gemm/x86-v4",
  "nano-gemm/x86-v4",
]
# the name the feature had while AVX-512 needed the nightly compiler
nightly = ["x86-v4"]
linalg = []
sparse = []
sparse-linalg = [
  "sparse",
  "linalg",
]
unstable = []

rayon = ["dep:rayon", "gemm/rayon", "t4a-private-gemm-x86?/rayon"]
# `Par::Team` is the parallel route; the feature names stay so `features = ["std", "rayon",
# "threadteam"]` in the consumers keeps meaning what it says. `threadteam` is what compiles the
# route, together with threadteam's own `parallel` feature (which is where its Rayon comes from).
# With it off there is no `Par::Team` and no team module: `Par::Seq` is the only token.
threadteam = ["rayon", "dep:threadteam", "threadteam/parallel"]
perf-warn = ["dep:log"]
# decision trace of the parallel gates (`utils::cost::trace`), for probes; off by default
par-trace = []
rand = [
  "num-complex/rand",
  "dep:rand",
  "dep:rand_distr",
]
npy = [
  "std",
  "dep:npyz",
]

[dev-dependencies]
aligned-vec = "0.6.4"
amd = "0.2.2"
assert_approx_eq = "1.1.0"
diol = { version = "0.13.1", default-features = false }
itertools = "0.14.0"
matrix-market-rs = "0.1.3"
nalgebra = "0.33"
toml = "0.9.8"
curl = "0.4.49"
flate2 = "1.1.5"
tar = "0.4.44"
simba = "0.9.1"
approx = "0.5.1"
openssl-sys = { version = "0.9.114", features = ["vendored"] }

serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.145"
serde_test = "1.0.177"

[target.'cfg(eigen)'.dev-dependencies]
eigen-bench-setup = { path = "../eigen-bench-setup" }

[target.'cfg(suitesparse)'.dev-dependencies]
suitesparse_sys = { version = "0.1.4", features = ["amd", "spqr", "umfpack", "colamd", "cholmod", "camd", "ccolamd", "openmp"] }

[target.'cfg(any(openblas, mkl, blis))'.dev-dependencies]
lapack-sys = "0.15.0"
openmp-sys = "1.3.0"

[target.'cfg(openblas)'.dev-dependencies]
openblas-src = { version = "0.10.13", features = ["system"] }
lapack-src = { version = "0.13", features = ["openblas"] }

[target.'cfg(mkl)'.dev-dependencies]
intel-mkl-src = "0.8.1" 
lapack-src = { version = "0.13", features = ["intel-mkl-src"] }

[target.'cfg(blis)'.dev-dependencies]
blis-src = { version = "0.2.2", features = ["system"] }
lapack-src = { version = "0.13", features = ["netlib"] }
netlib-src = { version = "0.9.0", features = ["system"] }

[package.metadata.docs.rs]
features = ["default"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(eigen)',
    'cfg(openblas)',
    'cfg(mkl)',
    'cfg(blis)',
    'cfg(faer)',
    'cfg(nalgebra)',
    'cfg(suitesparse)',
    'cfg(docs_rs)',
  ] }
